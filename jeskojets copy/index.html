<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로담 한의원 (Rodam Korean Medicine Clinic)</title>
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/styles.css">
    
    <!-- GSAP & ScrollTrigger -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    
    <!-- Lenovo Smooth Scroll (Lenis) -->
    <script src="https://unpkg.com/@studio-freight/lenis@1.0.39/dist/lenis.min.js"></script>
    
    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <canvas id="webgl-canvas"></canvas>

    <div class="smooth-scroll-wrapper" id="smooth-wrapper">
        <div id="smooth-content">
            <!-- 1. Hero Section -->
            <section class="section hero" id="hero">
                <div class="content-wrapper">
                    <h1 class="hero-title">비워내고, <br>다시 채우다</h1>
                    <p class="hero-subtitle">로담 한의원의 맑은 기운(氣)</p>
                </div>
            </section>

            <!-- 2. Core Title Section -->
            <section class="section core-title" id="core-title">
                <div class="content-wrapper">
                    <h2 class="reveal-text">자연에서 찾은 해답으로<br>당신의 본연의 건강을 되찾습니다.</h2>
                </div>
            </section>

            <!-- 3. History & Expertise Section -->
            <section class="section history" id="history">
                <div class="history-container">
                    <div class="history-item">
                        <h3>풍부한 임상 경험</h3>
                        <p>수만 건의 치료 사례를 통한 검증된 체질 개선 프로그램</p>
                    </div>
                    <div class="history-item">
                        <h3>청정 한약재</h3>
                        <p>자연의 생명력을 그대로 담은 엄선된 약재만을 사용합니다</p>
                    </div>
                    <div class="history-item">
                        <h3>맞춤형 진료</h3>
                        <p>1:1 심층 상담을 통해 개개인에 최적화된 처방</p>
                    </div>
                </div>
            </section>

            <!-- 4. Gallery Section -->
            <section class="section gallery" id="gallery">
                <div class="gallery-wrapper">
                    <div class="gallery-img-container">
                        <img src="https://images.unsplash.com/photo-1545063914-a1a6ddbbcecb?auto=format&fit=crop&q=80&w=1200" alt="Clinic Interior 1" class="parallax-img">
                    </div>
                    <div class="gallery-img-container">
                        <img src="https://images.unsplash.com/photo-1519494140681-8b17d7678b80?auto=format&fit=crop&q=80&w=1200" alt="Clinic Interior 2" class="parallax-img">
                    </div>
                </div>
            </section>

            <!-- 5. Therapy / Weekly Video Section -->
            <section class="section video-section" id="video-section">
                <div class="video-container">
                    <video autoplay muted loop playsinline class="bg-video">
                        <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
                    </video>
                    <div class="video-overlay">
                        <h2>치유의 과정을 경험하세요</h2>
                    </div>
                </div>
            </section>

            <!-- 6. Outro & Footer -->
            <footer class="footer" id="footer">
                <div class="footer-content">
                    <div class="footer-info">
                        <h2>로담 한의원</h2>
                        <p>서울특별시 강남구 테헤란로 123</p>
                        <p>T. 02-1234-5678</p>
                    </div>
                    <button class="back-to-top" id="backToTop">↑ Top</button>
                </div>
            </footer>
        </div>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
