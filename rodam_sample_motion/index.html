<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>자연의 이치로 몸을 바라보다 - 프리미엄 한의원</title>

    <!-- Font (Pretendard / Noto Serif KR) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;600;900&family=Pretendard:wght@300;400;500;700&display=swap"
      rel="stylesheet"
    />

    <!-- CSS -->
    <link rel="stylesheet" href="./css/reset.css" />
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body>
    <!-- 3D Background Canvas -->
    <canvas id="webgl-canvas"></canvas>

    <div id="smooth-wrapper">
      <div id="smooth-content">
        <!-- Header / Nav -->
        <header class="header">
          <div class="logo">로담(RODAM) 한의원</div>
          <nav>
            <button class="nav-btn">Menu</button>
          </nav>
        </header>

        <!-- 1. Hero Section -->
        <section class="section hero" id="hero">
          <div class="hero-content">
            <h1 class="hero-title">자연의 이치로<br />몸을 바라보다.</h1>
            <p class="hero-desc">근본을 다스리는 프리미엄 치유 공간</p>
          </div>
          <div class="scroll-indicator">
            <span>Scroll to explore</span>
            <div class="line"></div>
          </div>
        </section>

        <!-- 2. Core Title Section -->
        <section class="section core-title" id="philosophy">
          <div class="container">
            <h2 class="split-text">
              병의 증상만 보지 않고,<br />사람의 흔적을 읽습니다.
            </h2>
          </div>
        </section>

        <!-- 3. History Section (Horizontal) -->
        <section class="section history" id="history">
          <div class="history-wrapper">
            <div class="history-item">
              <h3>1998</h3>
              <p>로담 한의원 개원</p>
            </div>
            <div class="history-item">
              <h3>2005</h3>
              <p>전통 약재 연구소 설립</p>
            </div>
            <div class="history-item">
              <h3>2015</h3>
              <p>보건복지부 인증 획득</p>
            </div>
            <div class="history-item">
              <h3>2024</h3>
              <p>프리미엄 웰니스 센터 확장</p>
            </div>
          </div>
        </section>

        <!-- 4. Gallery Section -->
        <section class="section gallery" id="space">
          <div class="container">
            <div class="gallery-grid">
              <div class="gallery-item"></div>
              <div class="gallery-item"></div>
              <div class="gallery-item"></div>
              <div class="gallery-item"></div>
            </div>
          </div>
        </section>

        <!-- 5. Video Section -->
        <section class="section video" id="therapy">
          <div class="video-container">
            <!-- Video Thumbnail placeholder -->
            <div class="video-thumb"></div>
          </div>
        </section>

        <!-- 6. Footer -->
        <section class="section footer" id="contact">
          <div class="container">
            <h2>당신의 건강한 내일을 위해<br />항상 열려있습니다.</h2>
            <button class="cta-btn">진료 예약하기</button>
          </div>
        </section>
      </div>
    </div>

    <!-- Custom Cursor -->
    <div class="custom-cursor"></div>

    <!-- Scripts: Required Libraries -->
    <!-- Lenis for Smooth Scroll -->
    <script src="https://cdn.jsdelivr.net/gh/studio-freight/lenis@1.0.29/bundled/lenis.min.js"></script>

    <!-- GSAP Core & Plugins -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <!-- <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollToPlugin.min.js"></script> -->
    <!-- Note: SplitText is a premium Club GreenSock plugin. We might need to write a custom string splitter or use a free alternative if no license -->

    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <!-- Main Application Logic -->
    <script src="./js/main.js"></script>
  </body>
</html>
